<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact Me</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--acc:#25d366;--txt:#e8eaf0;--lbl:#8b949e;--r:12px;}
body{font-family:'Sora', sans-serif;background:#0d1117;background-attachment:fixed;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;color:var(--txt);}
.wa-card{background:#161b22;border-radius:12px;box-shadow:0 4px 30px rgba(0,0,0,.4);width:100%;max-width:480px;padding:36px 32px;}
.wa-head{margin-bottom:28px;}
.wa-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(37,211,102,.1);border:1px solid rgba(37,211,102,.2);border-radius:50px;padding:4px 12px;font-size:.75rem;color:#25d366;margin-bottom:14px;font-weight:600;}
.wa-logo{max-width:80px;max-height:80px;border-radius:var(--r);object-fit:cover;margin-bottom:14px;display:block;}
.wa-head h1{font-size:1.6rem;font-weight:700;color:var(--txt);line-height:1.2;margin-bottom:8px;}
.wa-head p{color:var(--lbl);font-size:.9rem;line-height:1.5;}
.wa-field{margin-bottom:18px;}
.wa-field label{display:block;font-size:.8rem;font-weight:600;color:var(--lbl);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.wa-field label span{color:#ff6b6b;margin-left:2px;}
.wa-field input,.wa-field textarea,.wa-field select{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:var(--r);padding:10px 13px;color:var(--txt);font-family:'Sora', sans-serif;font-size:.9rem;transition:.2s;outline:none;}
.wa-field input:focus,.wa-field textarea:focus,.wa-field select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(37,211,102,.15);}
.wa-field select option{background:#222;}
.wa-group-label{display:block;font-size:.8rem;font-weight:600;color:var(--lbl);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
.wa-option{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid rgba(255,255,255,.1);border-radius:calc(var(--r) - 2px);margin-bottom:6px;cursor:pointer;transition:.2s;font-size:.9rem;color:var(--txt);}
.wa-option:hover{border-color:var(--acc);background:rgba(37,211,102,.05);}
.wa-option input{width:auto;flex-shrink:0;}
.wa-stars{display:flex;gap:4px;align-items:center;}
.star-btn{background:none;border:none;font-size:1.6rem;color:rgba(255,255,255,.2);cursor:pointer;padding:0;transition:.2s;line-height:1;}
.star-btn.on,.star-btn:hover{color:#25d366;}
.wa-divider{text-align:center;position:relative;margin:22px 0 18px;}
.wa-divider::before{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:rgba(255,255,255,.1);}
.wa-divider span{position:relative;background:#161b22;padding:0 12px;font-size:.8rem;color:var(--lbl);font-weight:600;text-transform:uppercase;letter-spacing:.08em;}
.wa-submit{width:100%;padding:14px;background:var(--acc);border:none;border-radius:var(--r);color:#fff;font-family:'Sora', sans-serif;font-size:1rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px;transition:.2s;letter-spacing:.01em;}
.wa-submit:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:0 4px 20px rgba(37,211,102,.35);}
.wa-submit:active{transform:translateY(0);}
.wa-err{color:#ff6b6b;font-size:.78rem;margin-top:4px;display:none;}
@media(max-width:520px){.wa-card{padding:24px 18px;}.wa-head h1{font-size:1.35rem;}}
</style>
</head>
<body>
<div class="wa-card">
    <div class="wa-head">
        <div class="wa-badge"><svg width="18" height="18" viewBox="0 0 24 24" fill="#25d366"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347"/></svg>WhatsApp Form</div>
        
        <h1>Contact Me</h1>
        
    </div>
    <form id="waForm" novalidate>
        <div class="wa-field"><label for="field__7f3vtrn">Your Name<span>*</span></label><input type="text" id="field__7f3vtrn" name="field__7f3vtrn" placeholder="e.g. John Doe" required></div><div class="wa-field"><label for="field__wtc81h6">Phone Number</label><input type="tel" id="field__wtc81h6" name="field__wtc81h6" placeholder="+1 555 000 1234" ></div><div class="wa-field"><label for="field__qdugp36">Email</label><input type="email" id="field__qdugp36" name="field__qdugp36" placeholder="you@example.com" ></div><div class="wa-field"><label for="field__kbj9ggr">Your Message<span>*</span></label><textarea id="field__kbj9ggr" name="field__kbj9ggr" rows="4" placeholder="Write your message…" required></textarea></div>
        <div id="formErr" class="wa-err mb-3"></div>
        <button type="submit" class="wa-submit">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347"/></svg>
            Send on WhatsApp 💬
        </button>
    </form>
</div>
<script>
(function(){
    var phone="+923114861994".replace(/[^0-9]/g,'');
    // Star rating
    document.querySelectorAll('.wa-stars').forEach(function(st){
        var btns=st.querySelectorAll('.star-btn'),inp=st.querySelector('input[type=hidden]');
        btns.forEach(function(b){
            b.addEventListener('click',function(){
                var v=+b.dataset.val; inp.value=v;
                btns.forEach(function(x){x.classList.toggle('on',+x.dataset.val<=v);});
            });
            b.addEventListener('mouseenter',function(){
                var v=+b.dataset.val;
                btns.forEach(function(x){x.style.color=+x.dataset.val<=v?'var(--acc)':'rgba(255,255,255,.2)';});
            });
        });
        st.addEventListener('mouseleave',function(){
            var cur=+inp.value;
            btns.forEach(function(x){x.style.color='';x.classList.toggle('on',cur&&+x.dataset.val<=cur);});
        });
    });

    document.getElementById('waForm').addEventListener('submit',function(e){
        e.preventDefault();
        var err=document.getElementById('formErr');
        var data=new FormData(this);
        var lines=[];
        var ok=true;

        // Build checkboxes manually
        var cbMap={};
        document.querySelectorAll('input[type=checkbox]').forEach(function(cb){
            if(!cbMap[cb.name])cbMap[cb.name]=[];
            if(cb.checked)cbMap[cb.name].push(cb.value);
        });

        document.querySelectorAll('[name]').forEach(function(el){
            if(el.type==='checkbox') return;
            var label=el.closest('.wa-field')&&el.closest('.wa-field').querySelector('label')&&el.closest('.wa-field').querySelector('label').textContent.replace('*','').trim();
            if(!label)return;
            var val='';
            if(el.tagName==='SELECT') val=el.options[el.selectedIndex]&&el.options[el.selectedIndex].text!=='Choose…'?el.options[el.selectedIndex].text:'';
            else val=el.value?el.value.trim():'';
            if(el.required&&!val){ok=false;el.style.borderColor='#ff6b6b';return;}
            else el.style.borderColor='';
            if(val) lines.push('*'+label+'*: '+val);
        });
        // Checkboxes
        Object.keys(cbMap).forEach(function(name){
            var el=document.querySelector('[name="'+name+'[]"]');
            var label=el&&el.closest('.wa-field')&&el.closest('.wa-field').querySelector('.wa-group-label')&&el.closest('.wa-field').querySelector('.wa-group-label').textContent.trim();
            if(label&&cbMap[name].length) lines.push('*'+label+'*: '+cbMap[name].join(', '));
        });

        if(!ok){err.textContent='Please fill all required fields.';err.style.display='block';return;}
        err.style.display='none';

        var msg=encodeURIComponent('📋 *Contact Me*\n\n'+lines.join('\n'));
        var url='https://wa.me/'+phone+'?text='+msg;
        window.open(url,'_blank');
    });
})();
</script>
